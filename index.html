<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="gmailk-V BioHash Template Manager">
    <title>gmailk-V 模板管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0e17;
            --panel-bg: rgba(16, 22, 36, 0.75);
            --panel-border: rgba(56, 68, 90, 0.6);
            --primary: #6ea8fe;
            --primary-dim: rgba(110, 168, 254, 0.12);
            --primary-hover: #4d8fec;
            --danger: #f85149;
            --danger-dim: rgba(248, 81, 73, 0.1);
            --danger-hover: #da3633;
            --success: #3fb950;
            --success-dim: rgba(63, 185, 80, 0.1);
            --accent: #a78bfa;
            --accent-dim: rgba(167, 139, 250, 0.12);
            --text-main: #d1d9e6;
            --text-muted: #6d7a8d;
            --text-bright: #f0f4f8;
            --font-main: 'Inter', -apple-system, sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            --radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(110,168,254,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(167,139,250,0.05) 0%, transparent 50%);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        .container { max-width: 720px; margin: 0 auto; }

        /* ── Header ── */
        header {
            text-align: center;
            padding: 28px 0 36px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 16px rgba(110,168,254,0.25);
        }

        h1 {
            font-weight: 700;
            font-size: 1.75rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 400;
        }

        /* ── Status Bar ── */
        .status-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(8px);
        }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.online { background: var(--success); }
        .status-dot.offline { background: var(--danger); animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Input Section ── */
        .input-section {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 28px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-section:focus-within {
            border-color: rgba(110,168,254,0.35);
            box-shadow: 0 8px 40px rgba(110,168,254,0.08);
        }

        .input-section h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 16px;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        @media (max-width: 520px) {
            .form-row { flex-direction: column; }
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input[type="text"], textarea {
            width: 100%;
            background: rgba(6, 10, 18, 0.8);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            resize: none;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: #3a4458;
            font-family: var(--font-main);
        }

        .template-input {
            font-family: var(--font-code) !important;
            font-size: 0.82rem !important;
            min-height: 72px;
        }

        /* ── Buttons ── */
        button {
            font-family: var(--font-main);
            font-weight: 500;
            padding: 11px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #0a0e17;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(110,168,254,0.2);
        }
        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 4px 24px rgba(110,168,254,0.35);
        }

        .btn-danger {
            background: var(--danger-dim);
            color: var(--danger);
            border: 1px solid rgba(248,81,73,0.3);
        }
        .btn-danger:hover:not(:disabled) {
            background: var(--danger);
            color: #fff;
        }

        .btn-edit {
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid rgba(167,139,250,0.3);
        }
        .btn-edit:hover:not(:disabled) {
            background: var(--accent);
            color: #fff;
        }

        .btn-sm {
            padding: 7px 13px;
            font-size: 0.82rem;
        }

        /* ── List ── */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .list-header h2 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-bright);
        }

        .badge {
            background: var(--primary-dim);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
        }

        #personList {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ── Card ── */
        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            padding: 20px;
            position: relative;
            overflow: hidden;
            animation: slideIn 0.35s ease forwards;
            opacity: 0;
            transform: translateY(8px);
            transition: border-color 0.3s;
        }

        .card:hover { border-color: rgba(110,168,254,0.2); }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 3px; height: 100%;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            border-radius: 3px 0 0 3px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .card-identity {
            min-width: 0;
        }

        .person-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-bright);
            margin-bottom: 2px;
            word-break: break-word;
        }

        .person-id {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: var(--font-code);
        }

        .card-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .meta-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 0.88rem;
            color: var(--text-main);
        }

        .template-preview {
            background: rgba(6,10,18,0.7);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 14px;
            font-family: var(--font-code);
            font-size: 0.78rem;
            color: #7eb8ff;
            overflow-x: auto;
            white-space: nowrap;
            line-height: 1.5;
        }

        .template-preview .dim { color: var(--text-muted); }

        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
            border: 1px dashed var(--panel-border);
            border-radius: var(--radius);
        }

        .empty-state svg { margin-bottom: 14px; opacity: 0.35; }
        .empty-state p { font-size: 0.95rem; }

        /* ── Toast ── */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            backdrop-filter: blur(12px);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .toast-success {
            background: rgba(63,185,80,0.15);
            border: 1px solid rgba(63,185,80,0.3);
            color: var(--success);
        }

        .toast-error {
            background: rgba(248,81,73,0.15);
            border: 1px solid rgba(248,81,73,0.3);
            color: var(--danger);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* ── Loading ── */
        .loading {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            padding: 28px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .modal h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-bright);
            margin-bottom: 18px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 18px;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
        }
        .btn-ghost:hover { color: var(--text-main); border-color: var(--text-muted); }

        @media (max-width: 480px) {
            .card-top { flex-direction: column; gap: 10px; }
            .card-actions { margin-left: 0; width: 100%; }
            .card-actions button { flex: 1; }
        }
    </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3>編輯人員</h3>
        <input type="hidden" id="editId">
        <div class="form-grid">
            <div>
                <label for="editName">名稱</label>
                <input type="text" id="editName" placeholder="輸入名稱">
            </div>
            <div>
                <label for="editDesc">描述</label>
                <input type="text" id="editDesc" placeholder="選填描述">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-ghost btn-sm" onclick="closeModal()">取消</button>
            <button class="btn-primary btn-sm" onclick="submitEdit()">儲存</button>
        </div>
    </div>
</div>

<div class="container">
    <header>
        <div class="logo">
            <div class="logo-icon">🔐</div>
            <h1>gmailk-V</h1>
        </div>
        <p class="subtitle">BioHash 模板管理中心</p>
    </header>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
        <div class="status-chip">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">連線中...</span>
        </div>
        <div class="status-chip" id="uptimeChip" style="display:none;">
            ⏱️ <span id="uptimeText"></span>
        </div>
    </div>

    <!-- Create Form -->
    <section class="input-section">
        <h3>新增模板</h3>
        <div class="form-grid">
            <div class="form-row">
                <div style="flex:1;">
                    <label for="nameInput">名稱</label>
                    <input type="text" id="nameInput" placeholder="人員名稱" autocomplete="off">
                </div>
                <div style="flex:1;">
                    <label for="descInput">描述 (選填)</label>
                    <input type="text" id="descInput" placeholder="備註" autocomplete="off">
                </div>
            </div>
            <div>
                <label for="templateInput">碼字 (BioHash Template Hex)</label>
                <textarea id="templateInput" class="template-input" placeholder="貼上 hex 編碼的 BioHash 模板，例如: 0a191b2c3d4e5f60..."></textarea>
            </div>
            <div>
                <label for="payloadInput">加密酬載 (選填，Encrypted Payload)</label>
                <textarea id="payloadInput" class="template-input" style="min-height:48px;color:#c4b5fd;" placeholder="AES 加密後的資料 (base64 或 hex)，驗證成功後方可解密"></textarea>
            </div>
            <button class="btn-primary" id="createBtn" onclick="createPerson()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                寫入資料庫
            </button>
        </div>
    </section>

    <!-- Person List -->
    <div class="list-header">
        <h2>已註冊人員</h2>
        <span class="badge" id="countBadge">載入中</span>
    </div>
    <div id="personList">
        <div style="text-align:center; padding: 48px;">
            <div class="loading"></div>
        </div>
    </div>
</div>

<script>
    // ── Init ──
    fetchStatus();
    fetchPersons();
    setInterval(fetchStatus, 15000);

    document.getElementById('nameInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('templateInput').focus();
    });
    document.getElementById('templateInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); createPerson(); }
    });

    // ── API Functions ──
    async function fetchStatus() {
        try {
            const res = await fetch('/api/status');
            const s = await res.json();
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (s.db_connected) {
                dot.className = 'status-dot online';
                text.textContent = `已連線 · ${s.person_count} 人`;
            } else {
                dot.className = 'status-dot offline';
                text.textContent = '資料庫離線';
            }

            const uptimeChip = document.getElementById('uptimeChip');
            uptimeChip.style.display = 'inline-flex';
            document.getElementById('uptimeText').textContent = formatUptime(s.uptime_seconds);
        } catch {
            document.getElementById('statusDot').className = 'status-dot offline';
            document.getElementById('statusText').textContent = '無法連線';
        }
    }

    async function fetchPersons() {
        try {
            const res = await fetch('/api/persons');
            const data = await res.json();
            renderList(data);
        } catch (err) {
            document.getElementById('personList').innerHTML = `<div class="empty-state"><p>無法連接伺服器</p></div>`;
            document.getElementById('countBadge').textContent = '離線';
        }
    }

    async function createPerson() {
        const name = document.getElementById('nameInput').value.trim();
        const template = document.getElementById('templateInput').value.trim();
        const desc = document.getElementById('descInput').value.trim();
        const payload = document.getElementById('payloadInput').value.trim();
        const btn = document.getElementById('createBtn');

        if (!name) return toast('請輸入名稱', 'error');
        if (!template) return toast('請輸入碼字', 'error');
        if (!/^[0-9a-fA-F]+$/.test(template) || template.length % 2 !== 0) {
            return toast('碼字必須為有效的 hex 字串（偶數長度）', 'error');
        }

        btn.disabled = true;
        btn.innerHTML = '<div class="loading" style="width:14px;height:14px;border-width:2px;"></div>';

        try {
            const res = await fetch('/api/persons', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name,
                    biohash_template: template,
                    description: desc || undefined,
                    encrypted_payload: payload || undefined
                })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                const msg = err.detail?.[0]?.msg || err.detail || err.error || `HTTP ${res.status}`;
                throw new Error(msg);
            }

            document.getElementById('nameInput').value = '';
            document.getElementById('templateInput').value = '';
            document.getElementById('descInput').value = '';
            document.getElementById('payloadInput').value = '';
            toast(`已新增: ${name}`, 'success');
            fetchPersons();
            fetchStatus();
        } catch (err) {
            toast(`新增失敗: ${err.message}`, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 寫入資料庫';
        }
    }

    async function deletePerson(id, name, btnEl) {
        if (!confirm(`確定要刪除「${name}」？`)) return;
        btnEl.disabled = true;
        btnEl.textContent = '…';
        try {
            await fetch(`/api/persons/${id}`, { method: 'DELETE' });
            toast(`已刪除: ${name}`, 'success');
            fetchPersons();
            fetchStatus();
        } catch {
            toast('刪除失敗', 'error');
            btnEl.disabled = false;
            btnEl.textContent = '刪除';
        }
    }

    function openEditModal(id, name, desc) {
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = name;
        document.getElementById('editDesc').value = desc || '';
        document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('active');
    }

    async function submitEdit() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('editName').value.trim();
        const desc = document.getElementById('editDesc').value.trim();

        if (!name) return toast('名稱不能為空', 'error');

        try {
            const res = await fetch(`/api/persons/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description: desc || null })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            toast(`已更新: ${name}`, 'success');
            closeModal();
            fetchPersons();
        } catch {
            toast('更新失敗', 'error');
        }
    }

    // ── Render ──
    function renderList(persons) {
        const list = document.getElementById('personList');
        document.getElementById('countBadge').textContent = `${persons.length} 人`;
        list.innerHTML = '';

        if (persons.length === 0) {
            list.innerHTML = `
                <div class="empty-state">
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
                        <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                    </svg>
                    <p>尚無已註冊人員</p>
                </div>`;
            return;
        }

        persons.forEach((p, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.animationDelay = `${i * 0.04}s`;

            const date = p.created_at ? new Date(p.created_at).toLocaleString('zh-TW') : '-';
            const hexPreview = p.biohash_template.length > 48
                ? p.biohash_template.substring(0, 48)
                : p.biohash_template;
            const remaining = p.biohash_template.length - hexPreview.length;

            card.innerHTML = `
                <div class="card-top">
                    <div class="card-identity">
                        <div class="person-name">${esc(p.name)}</div>
                        <div class="person-id">ID: ${p.id}${p.description ? ' · ' + esc(p.description) : ''}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-edit btn-sm" onclick="openEditModal(${p.id}, '${esc(p.name)}', '${esc(p.description || '')}')">編輯</button>
                        <button class="btn-danger btn-sm" onclick="deletePerson(${p.id}, '${esc(p.name)}', this)">刪除</button>
                    </div>
                </div>
                <div class="meta-grid">
                    <div class="meta-item">
                        <span class="meta-label">模板大小</span>
                        <span class="meta-value">${p.template_bytes} bytes</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">建立時間</span>
                        <span class="meta-value">${date}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">加密酬載</span>
                        <span class="meta-value">${p.encrypted_payload ? '🔒 ' + p.encrypted_payload.length + ' chars' : '—'}</span>
                    </div>
                </div>
                <div class="template-preview">
                    ${hexPreview}${remaining > 0 ? `<span class="dim">…+${remaining} chars</span>` : ''}
                </div>
                ${p.encrypted_payload ? `<div class="template-preview" style="margin-top:8px;color:#c4b5fd;font-size:0.75rem;">
                    🔒 ${p.encrypted_payload.substring(0, 40)}${p.encrypted_payload.length > 40 ? '<span class="dim">…</span>' : ''}
                </div>` : ''}
            `;

            list.appendChild(card);
        });
    }

    // ── Helpers ──
    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function formatUptime(sec) {
        if (sec < 60) return `${sec}s`;
        if (sec < 3600) return `${Math.floor(sec/60)}m`;
        if (sec < 86400) return `${Math.floor(sec/3600)}h ${Math.floor((sec%3600)/60)}m`;
        return `${Math.floor(sec/86400)}d ${Math.floor((sec%86400)/3600)}h`;
    }

    function toast(msg, type = 'success') {
        const container = document.getElementById('toastContainer');
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.textContent = msg;
        container.appendChild(t);
        setTimeout(() => t.remove(), 3200);
    }
</script>
</body>
</html>
